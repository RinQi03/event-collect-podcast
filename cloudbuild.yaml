steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/event-collect-podcast:$COMMIT_SHA",
        ".",
      ]
  # Push the container image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/event-collect-podcast:$COMMIT_SHA"]
  # Deploy container image to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "event-collect-podcast"
      - "--image"
      - "gcr.io/$PROJECT_ID/event-collect-podcast:$COMMIT_SHA"
      - "--region"
      - "us-east5"
images:
  - "gcr.io/$PROJECT_ID/event-collect-podcast:$COMMIT_SHA"
